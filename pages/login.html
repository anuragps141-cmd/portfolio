<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login - ScamGuard Portal</title>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">ScamGuard Portal</div>
    </header>

    <main class="container login-page">
      <section class="main-content">
        <div class="card glass login-card">
          <h1>Welcome Back</h1>
          <p>Sign in to access your ScamGuard dashboard and analysis tools.</p>

          <div class="auth-toggle">
            <button id="showLogin" class="btn secondary active">Sign In</button>
            <button id="showRegister" class="btn secondary">Create Account</button>
          </div>

          <div id="loginPanel">
            <form id="loginForm">
              <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="you@example.com" required />
              </div>
              <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
              </div>
              <button type="submit" class="btn primary">Sign In</button>
            </form>
          </div>

          <div id="registerPanel" class="hidden">
            <form id="registerForm">
              <div class="form-group">
                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" placeholder="Your name" required />
              </div>
              <div class="form-group">
                <label for="registerEmail">Email</label>
                <input type="email" id="registerEmail" placeholder="you@example.com" required />
              </div>
              <div class="form-group">
                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="••••••••" required />
              </div>
              <button type="submit" class="btn primary">Create Account</button>
            </form>
          </div>

          <p id="loginMessage" class="message"></p>
        </div>
      </section>
    </main><script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/login.js"></script>
  </body>
</html>
